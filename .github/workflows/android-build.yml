name: Stop the Clock - Android Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java and Gradle versions
        working-directory: android
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" "$HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found"
            exit 127
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build existing web application
        run: npm run build

      - name: Synchronize Capacitor Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          unset ANDROID_DEBUG_KEYSTORE_PATH
          unset ANDROID_DEBUG_KEYSTORE_PASSWORD
          unset ANDROID_DEBUG_KEY_ALIAS
          unset ANDROID_DEBUG_KEY_PASSWORD
          ./gradlew assembleDebug --stacktrace --info

      - name: Verify APK exists
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stop-the-clock-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stop the Clock Android Development"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${ANDROID_VERSION_NAME}\`"
            echo "- Version code: \`${ANDROID_VERSION_CODE}\`"
            echo "- Artifact: \`stop-the-clock-debug-apk\`"
            echo "- Retention: 14 days"
            if test -f android/app/build/outputs/apk/debug/app-debug.apk; then
              echo "- Result: **SUCCESS**"
            else
              echo "- Result: **FAILED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
