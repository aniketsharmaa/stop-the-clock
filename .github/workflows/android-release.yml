name: Stop the Clock - Android Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set release version name
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="manual-${GITHUB_RUN_NUMBER}"
          fi
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=""
          [[ -n "$KEYSTORE_BASE64" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ -n "$KEY_ALIAS" ]] || missing="$missing ANDROID_KEY_ALIAS"
          [[ -n "$KEY_PASSWORD" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::error::Release signing is not configured. Missing secrets:$missing"
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build existing web application
        run: npm run build

      - name: Synchronize Capacitor Android assets
        run: npx cap sync android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stop-the-clock-release.jks"
          test -s "$RUNNER_TEMP/stop-the-clock-release.jks"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/stop-the-clock-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release AAB exists
        shell: bash
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: stop-the-clock-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish release build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stop the Clock Android Production Release"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${ANDROID_VERSION_NAME:-unknown}\`"
            echo "- Version code: \`${ANDROID_VERSION_CODE}\`"
            echo "- AAB artifact: \`stop-the-clock-release-aab\`"
            echo "- Google Play upload: **Not performed**"
            if test -f android/app/build/outputs/bundle/release/app-release.aab; then
              echo "- Result: **SUCCESS**"
            else
              echo "- Result: **FAILED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
